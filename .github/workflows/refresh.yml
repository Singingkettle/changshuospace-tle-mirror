name: refresh-tle-mirror

# Runs hourly (CelesTrak group queries are once-per-hour compliant).
# Manual dispatch is also enabled for catch-up.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      include_satcat:
        description: "Force SATCAT refresh on this run"
        required: false
        default: "false"

permissions:
  contents: write   # needed to publish/update the rolling 'latest' Release

env:
  # GitHub Actions is retiring the Node.js 20 runtime for JavaScript actions.
  # Opt in early so checkout/setup-python keep running after the forced switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # Shared with backfill.yml: one Space-Track credential, one group. See the
  # note there. Serialising the two workflows costs nothing (refresh takes
  # ~7 min, backfill ~4 min, against a 60-min cron) and removes the only
  # structural way two runners can hit the account at once.
  group: spacetrack-account
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt

      - name: Install deps
        run: pip install -r fetcher/requirements.txt

      - name: Decide whether to refresh SATCAT
        id: satcat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # SATCAT roughly once per UTC day. The old "hour == 00" gate never
          # fired in practice because GitHub cron schedules are delayed or
          # skipped unpredictably (observed: no run landed in the 00:xx slot
          # for days, so SATCAT went stale for months). Instead, look at the
          # satcat.json asset on the rolling release and refresh whenever it
          # is missing or older than 20 hours.
          MANUAL='${{ github.event.inputs.include_satcat }}'
          if [ "$MANUAL" = "true" ]; then
            echo "do_satcat=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The satcat.json asset on the rolling release survives non-satcat
          # runs (uploads use --clobber, nothing deletes it), so its
          # updated_at is the true last-refresh time.
          UPDATED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" \
            --jq '.assets[] | select(.name=="satcat.json") | .updated_at' \
            2>/dev/null || echo "")
          if [ -z "$UPDATED_AT" ]; then
            echo "no satcat.json asset on release -> refresh"
            echo "do_satcat=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE_H=$(python3 -c "
          from datetime import datetime, timezone
          dt = datetime.strptime('$UPDATED_AT', '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc)
          print(int((datetime.now(timezone.utc) - dt).total_seconds() // 3600))
          ")
          echo "satcat.json asset last updated ${AGE_H}h ago ($UPDATED_AT)"
          if [ "$AGE_H" -ge 20 ]; then
            echo "do_satcat=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_satcat=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch CelesTrak (all constellations)
        working-directory: fetcher
        run: python fetch_celestrak.py

      - name: Detect empty + forced groups (need ST fallback)
        id: empty_groups
        working-directory: fetcher
        run: |
          set -e
          python - <<'PY'
          import json, os, pathlib
          import sys
          sys.path.insert(0, '.')
          from constellations import FORCE_SPACETRACK_SLUGS
          data = pathlib.Path('../data')
          empty = []
          for f in sorted(data.glob('*.json')):
              if f.name == 'manifest.json':
                  continue
              try:
                  recs = json.loads(f.read_text() or '[]')
              except Exception:
                  recs = []
              if not recs:
                  empty.append(f.stem)
          # Always-augment slugs (yinhe / lynk) - re-query ST so the union of
          # CelesTrak + ST gets published.
          for slug in FORCE_SPACETRACK_SLUGS:
              if slug not in empty:
                  empty.append(slug)
          out = os.environ.get('GITHUB_OUTPUT')
          with open(out, 'a') as fh:
              fh.write(f"empty_slugs={' '.join(empty)}\n")
          print('empty_or_forced:', empty)
          PY

      - name: Fetch Space-Track GP for empty groups
        if: steps.empty_groups.outputs.empty_slugs != ''
        working-directory: fetcher
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
        run: |
          python fetch_spacetrack.py gp ${{ steps.empty_groups.outputs.empty_slugs }}

      - name: Fetch Space-Track SATCAT (daily)
        if: steps.satcat.outputs.do_satcat == 'true'
        working-directory: fetcher
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
        run: python fetch_spacetrack.py satcat

      - name: Fetch Space-Track recent decays (hourly)
        working-directory: fetcher
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
        # Single small SATCAT query (DECAY > now-45d). Without this the GP
        # feeds (which filter decay_date/null-val per Space-Track best
        # practice) never deliver decay information downstream.
        run: python fetch_spacetrack.py decays
        continue-on-error: true   # a missed decay cycle is fine; next hour catches up

      - name: Fetch JCAT operational status (planet4589)
        working-directory: fetcher
        run: python parse_jcat.py
        continue-on-error: true   # JCAT outage should not block the TLE release

      - name: Build manifest
        id: build
        working-directory: fetcher
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO:  ${{ github.event.repository.name }}
          GH_TAG:   latest
        run: python build_release.py

      - name: Upload to rolling 'latest' Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash fetcher/upload_release_assets.sh \
            latest \
            "TLE mirror (rolling)" \
            "Generated $(date -u +%FT%TZ) by GitHub Actions." \
            "${GITHUB_SHA}" \
            data

      - name: Tag a daily snapshot (UTC)
        if: steps.satcat.outputs.do_satcat == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY_TAG=$(date -u +%Y%m%d)
          bash fetcher/upload_release_assets.sh \
            "$DAY_TAG" \
            "TLE mirror $DAY_TAG" \
            "Daily snapshot for $DAY_TAG (UTC)." \
            "${GITHUB_SHA}" \
            data

      - name: Prune snapshots older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CUTOFF=$(date -u -d '7 days ago' +%Y%m%d)
          gh release list --limit 100 --json tagName --jq '.[].tagName' | \
            grep -E '^[0-9]{8}$' | while read TAG; do
              if [ "$TAG" -lt "$CUTOFF" ]; then
                echo "delete $TAG"
                gh release delete "$TAG" --yes --cleanup-tag || true
              fi
            done
